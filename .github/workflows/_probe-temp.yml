name: TEMP player probe
# Temporary scaffolding: agent sessions are behind an egress policy that blocks
# thesportsdb.com, so the probe has to run on a runner. Push-triggered on this branch
# only, and DELETED before the branch is merged — nothing permanent is added.
on:
  push:
    branches: [claude/probe-players]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'jfisher43769/Gibson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-players.js
      - name: Confirm data.js untouched
        run: git diff --exit-code -- data.js && echo "data.js clean"
