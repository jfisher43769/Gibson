name: TEMP player probe
on:
  push:
    branches: [claude/probe-players]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'jfisher43769/Gibson'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-players.js
      - name: Confirm data.js untouched
        run: git diff --exit-code -- data.js && echo "data.js clean"
