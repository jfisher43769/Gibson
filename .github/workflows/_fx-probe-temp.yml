name: Fixture probe (temp)
on: push
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'jfisher43769/Gibson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Raw upcoming feed
        run: |
          curl -sS -H 'User-Agent: GIBSON-IrishLeagueStats/1.0' \
            "https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=4659" \
            -o /tmp/next.json -w 'HTTP %{http_code}\n'
          echo "----- RAW PAYLOAD BEGIN -----"
          node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/next.json","utf8"));
            const ev=(j&&j.events)||[];
            console.log(JSON.stringify(ev.map(e=>({idLeague:e.idLeague,strHomeTeam:e.strHomeTeam,strAwayTeam:e.strAwayTeam,dateEvent:e.dateEvent,strTime:e.strTime,strVenue:e.strVenue})),null,1));
          '
          echo "----- RAW PAYLOAD END -----"
      - name: Fixture routine (DRY RUN)
        run: node scripts/fixture-update.js --dry-run
      - name: Confirm data.js untouched
        run: git diff --exit-code -- data.js && echo "data.js clean"
